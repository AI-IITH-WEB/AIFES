title: AIFES Lab
description: >-
  AIFES is a research laboratory at IIT Hyderabad advancing trustworthy AI across
  algorithmic trading, market microstructure, risk management, FinTech/DeFi,
  climate finance, RegTech, and computational game theory.

# Needed so jekyll-sitemap emits absolute URLs under the /AIFES project-page
# subpath, not just bare filenames.
url: "https://ai-iith-web.github.io"
baseurl: "/AIFES"

# jekyll-sitemap is in GitHub Pages' whitelisted plugin set, so this builds
# automatically — no Gemfile needed. Generates /sitemap.xml at build time.
plugins:
  - jekyll-sitemap

markdown: kramdown
